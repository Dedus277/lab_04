[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "algolab4"
version = "1.0.0"
description = "Algorithm and data structure implementations for lab 4"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
algolab4-benchmark = "algolab4.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]
